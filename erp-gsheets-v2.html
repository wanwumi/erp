<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>庫存管理 ERP</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1ed;--card:#fff;--bd:rgba(0,0,0,.09);--t:#111;--t2:#555;--t3:#aaa;--acc:#ff4d00;--grn:#00b87a;--amb:#f59e0b;--red:#ef4444;--th:64px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--t);font-size:15px}
input,select,textarea,button{font-family:inherit}
.setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;z-index:200}
.setup-logo{font-size:52px}
.setup h1{font-size:22px;font-weight:900;letter-spacing:-.5px}
.setup-desc{font-size:13px;color:var(--t2);line-height:1.65;max-width:300px}
.setup-card{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;text-align:left;display:flex;flex-direction:column;gap:14px}
.setup-card label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.setup-card input{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:12px;font-size:14px;color:var(--t);background:#f9f8f5;outline:none;transition:border-color .15s}
.setup-card input:focus{border-color:var(--acc)}
.conn-btn{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
.conn-btn:active{opacity:.85}
.conn-btn:disabled{opacity:.45}
.setup-err{font-size:13px;color:var(--red);text-align:center;min-height:18px}
.setup-hint{font-size:11px;color:var(--t3);line-height:1.6;max-width:300px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{background:var(--card);border-bottom:1px solid var(--bd);padding:11px 16px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:16px;font-weight:900;letter-spacing:-.4px}
.hdr-sub{font-size:10px;color:var(--t3);margin-top:1px}
.sync-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:50%}
.sdot.ok{background:var(--grn)}
.sdot.syncing{background:var(--amb);animation:pulse 1s infinite}
.sdot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-scan{padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;flex-shrink:0}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--th) + var(--sb) + 8px)}
.tab-bar{height:calc(var(--th) + var(--sb));padding-bottom:var(--sb);background:var(--card);border-top:1px solid var(--bd);display:flex;flex-shrink:0;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);border:none;background:none;padding:0;transition:color .15s}
.tab.active{color:var(--acc)}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:500}
.tab-scan-btn{position:relative;top:-14px;width:54px;height:54px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,77,0,.35);flex-shrink:0;cursor:pointer;border:none;color:#fff}
.tab-scan-btn svg{width:24px;height:24px}
.page{display:none}
.page.active{display:block}
.swrap{padding:12px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.sbox input{border:none;background:transparent;outline:none;font-size:15px;flex:1;color:var(--t)}
.sbox input::placeholder{color:var(--t3)}
.chips{display:flex;gap:7px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:500;border:1.5px solid var(--bd);background:var(--card);color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.active{background:var(--acc);border-color:var(--acc);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 10px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .1s}
.pcard:active{transform:scale(.97)}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;background:#f0efeb;display:block}
.pimg-ph{width:100%;aspect-ratio:1;background:#f0efeb;display:flex;align-items:center;justify-content:center;font-size:40px}
.pinfo{padding:10px 10px 12px}
.psku{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--t3);margin-bottom:3px}
.pname{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:7px}
.pfooter{display:flex;align-items:center;justify-content:space-between}
.pstock{font-size:13px;font-weight:700}
.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.ok{background:#e8faf3;color:var(--grn)}
.pill.warn{background:#fef3c7;color:var(--amb)}
.pill.danger{background:#fee2e2;color:var(--red)}
.dsec{padding:14px 14px 6px}
.dsec h2{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.krow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 14px 16px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px}
.kpi-l{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi-v{font-size:28px;font-weight:900;font-family:"JetBrains Mono",monospace;letter-spacing:-1px}
.kpi-s{font-size:10px;color:var(--t3);margin-top:2px}
.kpi.danger{background:#fee2e2}.kpi.danger .kpi-v{color:var(--red)}
.kpi.warn{background:#fef3c7}.kpi.warn .kpi-v{color:var(--amb)}
.alist{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.acard{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.acard:active{opacity:.8}
.acard-img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0}
.acard-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-det{font-size:11px;color:var(--t3);margin-top:2px}
.bcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 14px}
.bccard{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .1s}
.bccard:active{transform:scale(.97)}
.bccard-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0efeb;display:block}
.bccard-img-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:36px;background:#f0efeb}
.bccard-body{padding:10px}
.bccard-name{font-size:12px;font-weight:700;margin-bottom:6px;line-height:1.3}
.bccard-sku{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--acc);margin-top:4px}
.scan-page{display:flex;flex-direction:column;height:calc(100dvh - var(--th) - var(--sb) - 52px)}
.scan-hd{padding:16px;text-align:center}
.scan-hd h2{font-size:18px;font-weight:900}
.scan-hd p{font-size:13px;color:var(--t2);margin-top:3px}
#svp{flex:1;position:relative;overflow:hidden;background:#000;border-radius:20px;margin:0 14px}
#svp video{width:100%!important;height:100%!important;object-fit:cover}
.sov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sframe{width:220px;height:100px;border:3px solid var(--acc);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);position:relative}
.sline{position:absolute;left:6px;right:6px;height:2px;background:var(--acc);animation:sl 1.8s ease-in-out infinite}
@keyframes sl{0%,100%{top:15%}50%{top:85%}}
.sres{margin:12px 14px 0;background:var(--card);border-radius:14px;padding:14px;display:none}
.sres.show{display:flex;gap:12px;align-items:center}
.sres-img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0}
.sres-name{font-size:14px;font-weight:700}
.sres-sku{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc)}
.sres-stk{font-size:12px;color:var(--t2);margin-top:2px}
.sres-btn{padding:7px 12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.snf{margin:12px 14px 0;background:#fee2e2;border-radius:14px;padding:14px;text-align:center;display:none;font-size:13px;color:var(--red);font-weight:600}
.snf.show{display:block}
.sacts{padding:12px 14px;display:flex;gap:8px}
.sbtn{flex:1;padding:14px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn.go{background:var(--acc);color:#fff}
.sbtn.st{background:#f0efeb;color:var(--t);border:1px solid var(--bd)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;display:none;transition:background .25s}
.overlay.open{display:block;background:rgba(0,0,0,.45)}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;z-index:51;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:93vh;overflow-y:auto;padding-bottom:calc(var(--sb) + 24px)}
.sheet.open{transform:translateY(0)}
.sh-handle{width:36px;height:4px;background:#e0dfd9;border-radius:2px;margin:12px auto 0}
.sh-tabs{display:flex;border-bottom:1px solid var(--bd);margin:0 18px}
.sh-tab{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s}
.sh-tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.sh-pane{display:none;padding:16px 18px}
.sh-pane.active{display:block}
.ilist{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.irow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.irow:last-child{border-bottom:none}
.irow-l{font-size:13px;color:var(--t2)}
.irow-v{font-size:13px;font-weight:600;text-align:right;max-width:65%}
.eform{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--t);background:#f9f8f5;outline:none;width:100%;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{resize:vertical;min-height:72px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebtn{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:4px;transition:opacity .15s}
.savebtn:active{opacity:.8}
.savebtn.saving{opacity:.45;pointer-events:none}
.ai-box{background:#f9f8f5;border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--bd)}
.ai-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ai-row{display:flex;gap:8px}
.ai-inp{flex:1;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card);outline:none;color:var(--t)}
.ai-inp:focus{border-color:var(--acc)}
.ai-go{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.ai-resp{margin-top:10px;font-size:13px;color:var(--t2);line-height:1.6;display:none}
.ai-resp.show{display:block}
.ai-thinking{color:var(--t3);font-style:italic}
.ai-apply{margin-top:10px;background:var(--grn);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;display:none;width:100%}
.ai-apply.show{display:block}
.bc-wrap{background:#f9f8f5;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;border:1px solid var(--bd)}
.bc-wrap svg{max-width:100%;height:auto}
.ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;gap:14px;color:var(--t3);font-size:13px}
.spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(var(--th) + var(--sb) + 14px);left:50%;transform:translateX(-50%) translateY(20px);background:#1a1917;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:48px 24px;color:var(--t3)}
.empty-ic{font-size:48px;margin-bottom:12px}
.progress-bar{background:var(--bd);border-radius:999px;height:8px;overflow:hidden;margin-top:12px;width:200px}
.progress-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .3s}
@media print{
  .tab-bar,.header,.swrap,.chips,.page:not(#page-bc),.overlay,.sheet{display:none!important}
  #page-bc{display:block!important}
  body,html{overflow:visible;height:auto}
  .content{padding:0;overflow:visible}
  .bcgrid{grid-template-columns:repeat(3,1fr)!important;gap:6px;padding:4mm}
  .bccard{break-inside:avoid;border:1px solid #ddd;border-radius:8px}
}
</style>
</head>
<body>

<div id="setup" class="setup">
  <div class="setup-logo">📦</div>
  <h1>庫存管理 ERP</h1>
  <div class="setup-desc">輸入你的 Google Apps Script 網址和密碼，資料儲存在你的 Google Sheets，完全免費同步</div>
  <div class="setup-card">
    <div>
      <label>Apps Script 網址</label>
      <input id="gs-url" placeholder="https://script.google.com/macros/s/..." type="url" autocomplete="off" spellcheck="false">
    </div>
    <div>
      <label>密碼</label>
      <input id="gs-pwd" placeholder="erp2024" type="password" autocomplete="off">
    </div>
    <button class="conn-btn" id="conn-btn" onclick="connect()">連線並進入系統</button>
    <div class="setup-err" id="setup-err"></div>
  </div>
  <div class="setup-hint">還沒設定？請先照教學步驟操作完成 Apps Script 部署</div>
</div>

<div class="app" id="main-app" style="display:none">
  <div class="header">
    <div class="hdr-info">
      <div class="hdr-name">📦 庫存管理</div>
      <div class="hdr-sub" id="hdr-sub">連線中...</div>
    </div>
    <div class="sync-badge" id="sync-badge">
      <div class="sdot syncing" id="sdot"></div>
      <span id="sync-txt">同步中</span>
    </div>
    <button class="hdr-scan" onclick="navScan()">🔍 掃碼</button>
  </div>
  <div class="content">
    <div class="page active" id="page-dash">
      <div class="krow">
        <div class="kpi danger"><div class="kpi-l">需立即採購</div><div class="kpi-v" id="kpi-d">—</div><div class="kpi-s">低於安全庫存</div></div>
        <div class="kpi warn"><div class="kpi-l">即將不足</div><div class="kpi-v" id="kpi-w">—</div><div class="kpi-s">低於採購點</div></div>
      </div>
      <div class="dsec"><h2>🔴 需立即採購</h2></div>
      <div class="alist" id="al-d"></div>
      <div class="dsec"><h2>🟡 即將不足</h2></div>
      <div class="alist" id="al-w"></div>
    </div>
    <div class="page" id="page-prod">
      <div class="swrap">
        <div class="sbox">
          <svg width="18" height="18" fill="none" stroke="#aaa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
          <input placeholder="搜尋商品或貨號..." id="pq" oninput="filterP()" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="chips" id="pchips"></div>
      <div class="ldwrap" id="p-load">
        <div class="spin"></div>
        <span id="p-load-txt">載入中...</span>
        <div class="progress-bar"><div class="progress-fill" id="p-progress" style="width:0%"></div></div>
      </div>
      <div class="pgrid" id="pgrid" style="display:none"></div>
      <div class="empty" id="pempty" style="display:none"><div class="empty-ic">🔍</div><div>找不到商品</div></div>
    </div>
    <div class="page" id="page-scan">
      <div class="scan-page">
        <div class="scan-hd"><h2>掃描條碼</h2><p>對準商品條碼，自動辨識</p></div>
        <div id="svp"></div>
        <div class="sres" id="sres">
          <img id="simg" class="sres-img" src="" alt="">
          <div style="flex:1;min-width:0">
            <div class="sres-name" id="sname"></div>
            <div class="sres-sku" id="ssku"></div>
            <div class="sres-stk" id="sstk"></div>
          </div>
          <button class="sres-btn" id="sdtl-btn">詳情</button>
        </div>
        <div class="snf" id="snf">找不到此條碼</div>
        <div class="sacts">
          <button class="sbtn go" id="ss-btn" onclick="startScan()">▶ 開始掃描</button>
          <button class="sbtn st" id="sp-btn" style="display:none" onclick="stopScan()">■ 停止</button>
        </div>
      </div>
    </div>
    <div class="page" id="page-bc">
      <div class="swrap">
        <div class="sbox">
          <svg width="18" height="18" fill="none" stroke="#aaa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
          <input placeholder="搜尋條碼..." id="bcq" oninput="filterBc()" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="chips" id="bcchips"></div>
      <div style="padding:0 14px 10px">
        <button class="sbtn go" style="width:100%;font-size:13px;padding:12px;border-radius:12px" onclick="window.print()">🖨 列印全部條碼</button>
      </div>
      <div class="bcgrid" id="bcgrid"></div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-dash" onclick="nav('dash')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>首頁</span>
    </button>
    <button class="tab" id="tab-prod" onclick="nav('prod')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg>
      <span>商品</span>
    </button>
    <button class="tab-scan-btn" onclick="navScan()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6h1v12H4zm3 0h1v12H7zm2 0h2v12H9zm3 0h1v12h-1zm2 0h2v12h-2zm3 0h1v12h-1zm2 0h1v12h-1z"/></svg>
    </button>
    <button class="tab" id="tab-bc" onclick="nav('bc')">

let GS_URL='',GS_PWD='',DATA=[],SKUMAP={};
let pCat='全部',bcCat='全部',curIdx=-1,scanner=null,scanning=false,aiPending=null;
const CATS=['全部','水杯水壺類','水壺周邊配件','追星周邊','便當用品','生活收納','包材耗材','手工材料','髮飾配件','寵物用品','文具用品','旅行配件','其他'];
const BATCH=45;

async function gsCall(params){
  const qs=new URLSearchParams({...params,pwd:GS_PWD}).toString();
  const r=await fetch(GS_URL+'?'+qs);
  return r.json();
}
async function gsPost(body){
  const r=await fetch(GS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,pwd:GS_PWD})});
  return r.json();
}

async function connect(){
  const url=document.getElementById('gs-url').value.trim();
  const pwd=document.getElementById('gs-pwd').value.trim();
  if(!url||!pwd){showErr('請填寫網址和密碼');return;}
  const btn=document.getElementById('conn-btn');
  btn.disabled=true;btn.textContent='連線中...';
  document.getElementById('setup-err').textContent='';
  try{
    GS_URL=url;GS_PWD=pwd;
    const res=await gsCall({action:'ping'});
    if(!res.ok)throw new Error(res.error||'fail');
    localStorage.setItem('gs_url',url);
    localStorage.setItem('gs_pwd',pwd);
    document.getElementById('setup').style.display='none';
    document.getElementById('main-app').style.display='flex';
    await initApp(res.count);
  }catch(e){
    GS_URL='';GS_PWD='';
    btn.disabled=false;btn.textContent='連線並進入系統';
    showErr('連線失敗：請確認網址和密碼是否正確');
  }
}
function showErr(msg){document.getElementById('setup-err').textContent=msg;}

async function initApp(count){
  setSyncDot('syncing','載入中');
  if(count===0){
    await seedBatch();
  } else {
    await loadAll();
  }
}

async function seedBatch(){
  const total=SEED.length;
  const batches=[];
  for(let i=0;i<total;i+=BATCH) batches.push(SEED.slice(i,i+BATCH));
  setSyncDot('syncing','匯入中');
  document.getElementById('p-load-txt').textContent='匯入商品資料中... 0/'+total;

  for(let i=0;i<batches.length;i++){
    const done=i*BATCH;
    const pct=Math.round(done/total*100);
    document.getElementById('p-load-txt').textContent='匯入中... '+done+'/'+total;
    document.getElementById('p-progress').style.width=pct+'%';
    try{
      await gsPost({action:'seed_batch',products:batches[i],offset:done,total});
      await new Promise(r=>setTimeout(r,800));
    }catch(e){
      toast('第'+(i+1)+'批匯入失敗，繼續下一批');
    }
  }
  document.getElementById('p-load-txt').textContent='載入完成！';
  document.getElementById('p-progress').style.width='100%';
  await new Promise(r=>setTimeout(r,500));
  await loadAll();
}

async function loadAll(){
  setSyncDot('syncing','載入中');
  try{
    const res=await gsCall({action:'getAll'});
    if(!res.ok)throw new Error();
    DATA=res.data;
    rebuildMap();
    setSyncDot('ok','已同步');
    document.getElementById('hdr-sub').textContent='Google Sheets · '+DATA.length+' 件商品';
    renderDash();
    buildChips('pchips','p');
    buildChips('bcchips','bc');
    document.getElementById('p-load').style.display='none';
    document.getElementById('pgrid').style.display='grid';
    renderP();
  }catch(e){
    setSyncDot('err','同步失敗');
    toast('❌ 載入失敗，請重新整理');
  }
}

function rebuildMap(){SKUMAP={};DATA.forEach(p=>{SKUMAP[p.sku]=p;});}
function setSyncDot(s,txt){
  document.getElementById('sdot').className='sdot '+s;
  document.getElementById('sync-txt').textContent=txt||s;
}
function scol(p){return p.total_stock<=p.safe?'var(--red)':p.total_stock<=p.reorder?'var(--amb)':'var(--grn)';}
function spill(p){
  if(p.total_stock<=p.safe)return'<span class="pill danger">缺貨</span>';
  if(p.total_stock<=p.reorder)return'<span class="pill warn">偏低</span>';
  return'<span class="pill ok">正常</span>';
}
function pimg(url,cls){
  return url
    ?`<img src="${url}" class="${cls}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="${cls}-ph" style="display:none">📦</div>`
    :`<div class="${cls}-ph">📦</div>`;
}
function toast(msg,dur=2400){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),dur);
}
function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab,.tab-scan-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  (document.getElementById('tab-'+id)||document.getElementById('tab-dash')).classList.add('active');
  if(id==='prod')renderP();
  if(id==='bc')renderBc();
  if(id==='dash')renderDash();
  if(id!=='scan'&&scanning)stopScan();
}
function navScan(){nav('scan');}
function renderDash(){
  const d=DATA.filter(p=>p.total_stock<=p.safe);
  const w=DATA.filter(p=>p.total_stock>p.safe&&p.total_stock<=p.reorder);
  document.getElementById('kpi-d').textContent=d.length;
  document.getElementById('kpi-w').textContent=w.length;
  const row=(p,ic)=>`<div class="acard" onclick="openSheet(${DATA.indexOf(p)})">

    ${p.img?`<img class="acard-img" src="${p.img}" loading="lazy">`:`<div class="acard-img" style="display:flex;align-items:center;justify-content:center;font-size:20px">📦</div>`}
    <div style="flex:1;min-width:0"><div class="acard-name">${p.short_name}</div><div class="acard-det">${p.sku} · 庫存 <b style="color:var(--red)">${p.total_stock}</b> / 安全 ${p.safe}</div></div>
  </div>`;
  document.getElementById('al-d').innerHTML=d.length?d.map(p=>row(p,'🔴')).join(''):`<div style="text-align:center;padding:18px;color:var(--t3)">目前無需採購 ✅</div>`;
  document.getElementById('al-w').innerHTML=w.length?w.map(p=>row(p,'🟡')).join(''):`<div style="text-align:center;padding:18px;color:var(--t3)">目前無即將不足 ✅</div>`;
}
function buildChips(elId,type){
  const active=type==='p'?pCat:bcCat;
  document.getElementById(elId).innerHTML=CATS.map(c=>`<div class="chip ${active===c?'active':''}" onclick="setCat('${c}','${type}')">${c}</div>`).join('');
}
function setCat(cat,type){if(type==='p'){pCat=cat;renderP();buildChips('pchips','p');}else{bcCat=cat;renderBc();buildChips('bcchips','bc');}}
function filterP(){renderP();}
function getP(){
  const q=(document.getElementById('pq')?.value||'').toLowerCase();
  return DATA.filter(p=>{
    if(pCat!=='全部'&&p.cat!==pCat)return false;
    if(q&&!p.short_name.toLowerCase().includes(q)&&!p.sku.toLowerCase().includes(q)&&!(p.name||'').toLowerCase().includes(q))return false;
    return true;
  });
}
function renderP(){
  const f=getP();
  const g=document.getElementById('pgrid'),e=document.getElementById('pempty');
  if(!DATA.length)return;
  if(!f.length){g.innerHTML='';e.style.display='';return;}
  e.style.display='none';g.style.display='grid';
  g.innerHTML=f.map(p=>`<div class="pcard" onclick="openSheet(${DATA.indexOf(p)})">
    ${pimg(p.img,'pimg')}
    <div class="pinfo"><div class="psku">${p.sku}</div><div class="pname">${p.short_name}</div>
    <div class="pfooter"><span class="pstock" style="color:${scol(p)}">${Number(p.total_stock).toLocaleString()}</span>${spill(p)}</div></div>
  </div>`).join('');
}
function filterBc(){renderBc();}
function getBc(){
  const q=(document.getElementById('bcq')?.value||'').toLowerCase();
  return DATA.filter(p=>{
    if(bcCat!=='全部'&&p.cat!==bcCat)return false;
    if(q&&!p.short_name.toLowerCase().includes(q)&&!p.sku.toLowerCase().includes(q))return false;
    return true;
  });
}
function renderBc(){
  const f=getBc();
  document.getElementById('bcgrid').innerHTML=f.map((p,i)=>`<div class="bccard" onclick="openSheet(${DATA.indexOf(p)})">
    ${p.img?`<img class="bccard-img" src="${p.img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="bccard-img-ph" style="display:none">📦</div>`:`<div class="bccard-img-ph">📦</div>`}
    <div class="bccard-body"><div class="bccard-name">${p.short_name}</div><svg id="bcsvg${i}"></svg><div class="bccard-sku">${p.sku}</div></div>
  </div>`).join('');
  requestAnimationFrame(()=>{f.forEach((p,i)=>{try{JsBarcode('#bcsvg'+i,p.sku,{format:'CODE128',width:1.5,height:36,fontSize:0,displayValue:false,margin:2,background:'#fff'});}catch(e){}});});
}
function openSheet(idx){
  curIdx=idx;const p=DATA[idx];
  document.getElementById('sh-img-wrap').innerHTML=p.img
    ?`<img src="${p.img}" style="width:100%;max-height:200px;object-fit:cover;display:block;margin-top:12px" onerror="this.style.display='none'">`
    :`<div style="height:160px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#f0efeb;margin-top:12px">📦</div>`;
  document.getElementById('sh-sku').textContent=p.sku;
  document.getElementById('sh-name').textContent=p.short_name;
  const upd=p.updated_at?new Date(p.updated_at).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  document.getElementById('sh-info').innerHTML=`
    <div class="irow"><span class="irow-l">現有庫存</span><span class="irow-v" style="color:${scol(p)};font-size:17px">${p.total_stock} 件</span></div>
    <div class="irow"><span class="irow-l">狀態</span><span class="irow-v">${spill(p)}</span></div>
    <div class="irow"><span class="irow-l">安全庫存</span><span class="irow-v">${p.safe}</span></div>
    <div class="irow"><span class="irow-l">採購點</span><span class="irow-v">${p.reorder}</span></div>
    <div class="irow"><span class="irow-l">售價</span><span class="irow-v">$${parseFloat(p.price||0).toLocaleString()}</span></div>
    <div class="irow"><span class="irow-l">進貨成本</span><span class="irow-v">${p.cost?'$'+p.cost:'—'}</span></div>
    <div class="irow"><span class="irow-l">廠商</span><span class="irow-v">${p.supplier||'—'}</span></div>
    <div class="irow"><span class="irow-l">類別</span><span class="irow-v">${p.cat}</span></div>
    <div class="irow"><span class="irow-l">備註</span><span class="irow-v">${p.note||'—'}</span></div>
    <div class="irow"><span class="irow-l">最後更新</span><span class="irow-v" style="font-size:11px">${upd}</span></div>`;
  document.getElementById('ef-sn').value=p.short_name||'';
  document.getElementById('ef-pr').value=p.price||'';
  document.getElementById('ef-st').value=p.total_stock||0;
  document.getElementById('ef-sf').value=p.safe||0;
  document.getElementById('ef-ro').value=p.reorder||0;
  document.getElementById('ef-co').value=p.cost||'';
  document.getElementById('ef-sp').value=p.supplier||'';
  document.getElementById('ef-ct').value=p.cat||'其他';
  document.getElementById('ef-nt').value=p.note||'';
  document.getElementById('ai-inp').value='';
  document.getElementById('ai-resp').className='ai-resp';document.getElementById('ai-resp').textContent='';
  document.getElementById('ai-apply').className='ai-apply';aiPending=null;
  document.getElementById('sh-bc-sku').textContent=p.sku;
  setTimeout(()=>{try{JsBarcode('#sh-bc',p.sku,{format:'CODE128',width:2,height:55,fontSize:12,displayValue:true,margin:6,background:'#f9f8f5'});}catch(e){}},60);
  stab(0);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function stab(n){
  document.querySelectorAll('.sh-tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.sh-pane').forEach((p,i)=>p.classList.toggle('active',i===n));
}
async function saveEdit(){
  if(curIdx<0)return;
  const p=DATA[curIdx];
  const btn=document.getElementById('savebtn');
  btn.textContent='儲存中...';btn.classList.add('saving');
  setSyncDot('syncing','儲存中');
  const updates={
    short_name:document.getElementById('ef-sn').value.trim()||p.short_name,
    price:parseFloat(document.getElementById('ef-pr').value)||0,
    total_stock:parseInt(document.getElementById('ef-st').value)||0,
    safe:parseInt(document.getElementById('ef-sf').value)||0,
    reorder:parseInt(document.getElementById('ef-ro').value)||0,
    cost:parseFloat(document.getElementById('ef-co').value)||0,
    supplier:document.getElementById('ef-sp').value.trim(),
    cat:document.getElementById('ef-ct').value,
    note:document.getElementById('ef-nt').value.trim()
  };
  try{
    const res=await gsPost({action:'update',sku:p.sku,data:updates});
    if(!res.ok)throw new Error(res.error);
    Object.assign(DATA[curIdx],updates);
    DATA[curIdx].updated_at=new Date().toISOString();
    rebuildMap();
    setSyncDot('ok','已同步');
    btn.textContent='💾 儲存到 Google Sheets';btn.classList.remove('saving');
    toast('✅ 已儲存！');
    openSheet(curIdx);
  }catch(e){
    setSyncDot('err','儲存失敗');
    btn.textContent='💾 儲存到 Google Sheets';btn.classList.remove('saving');
    toast('❌ 儲存失敗，請重試');
  }
}
async function sendAI(){
  if(curIdx<0)return;
  const p=DATA[curIdx];
  const msg=document.getElementById('ai-inp').value.trim();
  if(!msg)return;
  const resp=document.getElementById('ai-resp');
  resp.className='ai-resp show ai-thinking';resp.textContent='AI 思考中...';
  document.getElementById('ai-apply').className='ai-apply';aiPending=null;
  const ctx=`你是庫存管理助理，用繁體中文。商品「${p.short_name}」(${p.sku})：庫存${p.total_stock}、安全庫存${p.safe}、採購點${p.reorder}、售價${p.price}、廠商${p.supplier||'未設'}。
使用者說：「${msg}」。請1-2句說明修改，然後輸出JSON：\`\`\`json
{"欄位":"值"}
\`\`\`
可用欄位：short_name total_stock safe reorder price cost supplier cat note`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:ctx}]})});
    const d=await r.json();
    const txt=d.content?.map(c=>c.text||'').join('')||'';
    const jm=txt.match(/```json\s*([\s\S]*?)```/);
    if(jm){try{aiPending=JSON.parse(jm[1]);}catch(e){}}
    resp.className='ai-resp show';resp.textContent=txt.replace(/```json[\s\S]*?```/,'').trim()||'分析完成。';
    if(aiPending)document.getElementById('ai-apply').className='ai-apply show';
  }catch(e){resp.className='ai-resp show';resp.textContent='無法連接 AI，請手動編輯。';}
}
function applyAI(){
  if(!aiPending||curIdx<0)return;
  const m={short_name:'ef-sn',total_stock:'ef-st',safe:'ef-sf',reorder:'ef-ro',price:'ef-pr',cost:'ef-co',supplier:'ef-sp',cat:'ef-ct',note:'ef-nt'};
  Object.entries(aiPending).forEach(([k,v])=>{const el=document.getElementById(m[k]);if(el)el.value=v;});
  stab(1);toast('已填入，請確認後儲存');
  document.getElementById('ai-apply').className='ai-apply';aiPending=null;
}
function startScan(){
  document.getElementById('ss-btn').style.display='none';document.getElementById('sp-btn').style.display='';
  document.getElementById('sres').classList.remove('show');document.getElementById('snf').classList.remove('show');
  const vp=document.getElementById('svp');
  vp.innerHTML='<div class="sov"><div class="sframe"><div class="sline"></div></div></div>';
  scanner=new Html5Qrcode('svp');
  scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:220,height:100}},handleScan,()=>{})
    .then(()=>{scanning=true;})
    .catch(()=>{
      vp.innerHTML='<div style="color:#fff;padding:60px 20px;text-align:center;font-size:14px">請允許相機權限</div>';
      document.getElementById('ss-btn').style.display='';document.getElementById('sp-btn').style.display='none';
    });
}
function stopScan(){
  if(scanner&&scanning){scanner.stop().catch(()=>{});scanning=false;}
  document.getElementById('svp').innerHTML='';
  document.getElementById('ss-btn').style.display='';document.getElementById('sp-btn').style.display='none';
}
let lastCode='',lastTime=0;
function handleScan(code){
  const now=Date.now();if(code===lastCode&&now-lastTime<3000)return;
  lastCode=code;lastTime=now;
  const p=SKUMAP[code];
  if(p){
    document.getElementById('snf').classList.remove('show');
    document.getElementById('simg').src=p.img||'';
    document.getElementById('sname').textContent=p.short_name;
    document.getElementById('ssku').textContent=p.sku;
    document.getElementById('sstk').textContent='庫存 '+p.total_stock+' 件 · '+p.cat;
    document.getElementById('sdtl-btn').onclick=()=>openSheet(DATA.indexOf(p));
    document.getElementById('sres').classList.add('show');
    if(navigator.vibrate)navigator.vibrate(60);
  }else{
    document.getElementById('sres').classList.remove('show');
    document.getElementById('snf').classList.add('show');
    document.getElementById('snf').textContent='找不到：'+code;
  }
}
function printOne(){
  const p=DATA[curIdx];if(!p)return;
  const svg=document.getElementById('sh-bc').outerHTML;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><style>body{margin:16px;text-align:center;font-family:sans-serif}img{max-width:180px;border-radius:8px;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}svg{max-width:240px}.n{font-size:14px;font-weight:700;margin:6px 0 2px}.s{font-size:12px;color:#666}</style></head><body>${p.img?`<img src="${p.img}">`:''}
<div class="n">${p.short_name}</div>${svg}<div class="s">${p.sku}</div>
<script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}
(function(){
  const url=localStorage.getItem('gs_url');const pwd=localStorage.getItem('gs_pwd');
  if(url&&pwd){
    document.getElementById('gs-url').value=url;document.getElementById('gs-pwd').value=pwd;
    GS_URL=url;GS_PWD=pwd;
    document.getElementById('setup').style.display='none';
    document.getElementById('main-app').style.display='flex';
    gsCall({action:'ping'}).then(res=>{
      if(res.ok)initApp(res.count);
      else{GS_URL='';GS_PWD='';localStorage.clear();document.getElementById('setup').style.display='flex';document.getElementById('main-app').style.display='none';}
    }).catch(()=>{document.getElementById('setup').style.display='flex';document.getElementById('main-app').style.display='none';});
  }
})();
</script>
